<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソルジャータイピング ランキング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0a0a1a;
  color: #fff;
  font-family: 'Courier New', monospace;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1 {
  text-align: center;
  color: #FFD700;
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 4px;
  text-shadow: 0 0 12px #FFD70066;
  flex: none;
}
.sub {
  text-align: center;
  color: #556;
  font-size: 11px;
  margin-bottom: 10px;
  flex: none;
}
/* スクロールできる一覧エリア */
#scroll-area {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  border: 1px solid #1a1a2e;
  border-radius: 6px;
  position: relative;
}
/* スクロールバーを見やすく */
#scroll-area::-webkit-scrollbar { width: 10px; }
#scroll-area::-webkit-scrollbar-track { background: #0d0d22; }
#scroll-area::-webkit-scrollbar-thumb { background: #33335a; border-radius: 5px; }
#scroll-area::-webkit-scrollbar-thumb:hover { background: #4a4a7a; }
#scroll-area { scrollbar-width: thin; scrollbar-color: #33335a #0d0d22; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #12122a;
}
th {
  color: #aaa;
  border-bottom: 1px solid #333;
  padding: 7px 8px;
  text-align: left;
}
th:last-child, td:last-child { text-align: right; }
th:nth-child(3), td:nth-child(3) { text-align: right; }
td {
  padding: 6px 8px;
  border-bottom: 1px solid #1a1a2e;
}
tr:hover td { background: #111130; }
.rank-1 { color: #FFD700; }
.rank-2 { color: #C0C0C0; }
.rank-3 { color: #CD7F32; }
.wave-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  background: #1a1a3a;
  color: #88aaff;
  white-space: nowrap;
}
.wave-5 { background: #2a1a3a; color: #cc88ff; }
/* 同じ名前をまとめた時の記録数 */
.plays {
  display: inline-block;
  margin-left: 6px;
  padding: 0 5px;
  border-radius: 3px;
  font-size: 10px;
  background: #1a2a1a;
  color: #7ac77a;
  vertical-align: middle;
}
/* 表示切り替え */
#view-toggle {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 8px;
  flex: none;
}
#view-toggle button {
  font-family: inherit;
  font-size: 11px;
  padding: 5px 12px;
  border: 1px solid #26264a;
  border-radius: 999px;
  background: #101028;
  color: #778;
  cursor: pointer;
}
#view-toggle button:hover { border-color: #3a3a6a; color: #aab; }
#view-toggle button.on {
  background: #1d1d44;
  border-color: #FFD70066;
  color: #FFD700;
}
#count { text-align: center; color: #445; font-size: 10px; margin-bottom: 6px; flex: none; }
#loading { text-align: center; color: #556; padding: 40px; font-size: 14px; }
#updated { text-align: center; color: #334; font-size: 10px; margin-top: 8px; flex: none; }
/* スクロールを促すヒント */
#scroll-hint {
  text-align: center;
  color: #667;
  font-size: 10px;
  letter-spacing: 1px;
  margin: 6px 0 2px;
  flex: none;
}
#scroll-hint .arrow { animation: bob 1.4s ease-in-out infinite; display: inline-block; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
</style>
</head>
<body>
<h1>RANKING</h1>
<p class="sub">ソルジャータイピング 歴代スコア</p>
<div id="view-toggle">
  <button id="btn-best" class="on" type="button">1人1件（ベスト）</button>
  <button id="btn-all" type="button">すべての記録</button>
</div>
<div id="count"></div>
<div id="scroll-area">
  <div id="loading">読み込み中...</div>
  <table id="rank-table" style="display:none">
    <thead>
      <tr>
        <th style="width:36px;">#</th>
        <th>名前</th>
        <th>スコア</th>
        <th>Wave</th>
        <th>日付</th>
      </tr>
    </thead>
    <tbody id="rank-body"></tbody>
  </table>
</div>
<div id="scroll-hint"><span class="arrow">▼</span> スクロールで続きを見る <span class="arrow">▼</span></div>
<div id="updated"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhMkq24FzmHjnJu0OQ7SeQgEV__eY9iGo",
  authDomain: "bubble-wars-ffcd4.firebaseapp.com",
  projectId: "bubble-wars-ffcd4",
  storageBucket: "bubble-wars-ffcd4.firebasestorage.app",
  messagingSenderId: "465836224399",
  appId: "1:465836224399:web:8852c314794cfc69a025fa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 表示する最大件数
const MAX_ROWS = 100;

// シードスコア（実プレイのスコアと一緒にソートされる）
const SEED = [
  {name:'うんこ',                 score:287000, wave:5, date:'2026/6/8'},
  {name:'こうた',                 score:264500, wave:5, date:'2026/6/8'},
  {name:'バトルロワイアルZの使者', score:251000, wave:5, date:'2026/6/8'},
  {name:'AAA',                   score:238000, wave:5, date:'2026/6/8'},
  {name:'勇者',                   score:226500, wave:5, date:'2026/6/8'},
  {name:'Hunter',                score:213000, wave:5, date:'2026/6/8'},
  {name:'ランスロット',            score:205000, wave:5, date:'2026/6/8'},
];

// 「1人1件（ベスト）」か「すべての記録」か。スコア自体は消さず、表示だけを切り替える
let mergeSameName = true;
let allRows = [];

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// 同一人物とみなす名前キー。全角/半角・大文字小文字・空白の違いを吸収する
function nameKey(name) {
  let s = String(name ?? '').trim();
  try { s = s.normalize('NFKC'); } catch {}
  return s.replace(/\s+/g, '').toLowerCase();
}

// 同じ名前の記録をベストスコアの1件にまとめる（元データはそのまま）
function mergeByName(rows) {
  const map = new Map();
  rows.forEach(r => {
    const key = nameKey(r.name);
    const cur = map.get(key);
    if (!cur) {
      map.set(key, { ...r, plays: 1 });
    } else if ((r.score ?? 0) > (cur.score ?? 0)) {
      map.set(key, { ...r, plays: cur.plays + 1 });
    } else {
      cur.plays++;
    }
  });
  return [...map.values()];
}

function draw() {
  const rows = (mergeSameName ? mergeByName(allRows) : allRows.map(r => ({ ...r, plays: 1 })))
    .sort((a, b) => (b.score ?? 0) - (a.score ?? 0))
    .slice(0, MAX_ROWS);

  const tbody = document.getElementById('rank-body');
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#445;padding:24px;">まだスコアがありません</td></tr>';
  } else {
    rows.forEach((e, i) => {
      const rank = i + 1;
      const cls = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
      const waveCls = e.wave === 5 ? 'wave-badge wave-5' : 'wave-badge';
      const plays = e.plays > 1
        ? `<span class="plays" title="${e.plays}件の記録のうちベストスコア">×${e.plays}</span>`
        : '';
      const tr = document.createElement('tr');
      if (cls) tr.className = cls;
      tr.innerHTML = `
        <td>${rank}.</td>
        <td>${esc(e.name)}${plays}</td>
        <td><b>${(e.score ?? 0).toLocaleString()}</b></td>
        <td><span class="${waveCls}">Wave ${esc(e.wave)}</span></td>
        <td style="color:#445;font-size:11px;">${esc(e.date)}</td>`;
      tbody.appendChild(tr);
    });
  }

  const players = mergeByName(allRows).length;
  document.getElementById('count').textContent = mergeSameName
    ? `${players}人 / 全${allRows.length}件（同じ名前はベストスコアのみ表示）`
    : `全${allRows.length}件を表示中（${players}人）`;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('rank-table').style.display = '';
  document.getElementById('updated').textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');

  // スクロールできる件数がある時だけヒントを表示
  const area = document.getElementById('scroll-area');
  const hint = document.getElementById('scroll-hint');
  hint.style.visibility = (area.scrollHeight > area.clientHeight + 4) ? 'visible' : 'hidden';
}

function setMode(merge) {
  mergeSameName = merge;
  document.getElementById('btn-best').classList.toggle('on', merge);
  document.getElementById('btn-all').classList.toggle('on', !merge);
  document.getElementById('scroll-area').scrollTop = 0;
  draw();
}
document.getElementById('btn-best').addEventListener('click', () => setMode(true));
document.getElementById('btn-all').addEventListener('click', () => setMode(false));

const q = query(collection(db, 'scores'), orderBy('score', 'desc'), limit(500));
onSnapshot(q, snap => {
  allRows = [...snap.docs.map(d => d.data()), ...SEED];
  draw();
}, err => {
  document.getElementById('loading').textContent = 'ランキングの取得に失敗しました';
  console.error(err);
});
</script>
</body>
</html>
