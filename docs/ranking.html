<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ソルジャータイピング ランキング</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0a0a1a;
  color: #fff;
  font-family: 'Courier New', monospace;
  padding: 16px 16px 8px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1 {
  text-align: center;
  color: #FFD700;
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 4px;
  text-shadow: 0 0 12px #FFD70066;
  flex: none;
}
.sub {
  text-align: center;
  color: #556;
  font-size: 11px;
  margin-bottom: 10px;
  flex: none;
}
/* スクロールできる一覧エリア */
#scroll-area {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  border: 1px solid #1a1a2e;
  border-radius: 6px;
  position: relative;
}
/* スクロールバーを見やすく */
#scroll-area::-webkit-scrollbar { width: 10px; }
#scroll-area::-webkit-scrollbar-track { background: #0d0d22; }
#scroll-area::-webkit-scrollbar-thumb { background: #33335a; border-radius: 5px; }
#scroll-area::-webkit-scrollbar-thumb:hover { background: #4a4a7a; }
#scroll-area { scrollbar-width: thin; scrollbar-color: #33335a #0d0d22; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #12122a;
}
th {
  color: #aaa;
  border-bottom: 1px solid #333;
  padding: 7px 8px;
  text-align: left;
}
th:last-child, td:last-child { text-align: right; }
th:nth-child(3), td:nth-child(3) { text-align: right; }
td {
  padding: 6px 8px;
  border-bottom: 1px solid #1a1a2e;
}
tr:hover td { background: #111130; }
.rank-1 { color: #FFD700; }
.rank-2 { color: #C0C0C0; }
.rank-3 { color: #CD7F32; }
.wave-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  background: #1a1a3a;
  color: #88aaff;
}
.wave-5 { background: #2a1a3a; color: #cc88ff; }
#loading { text-align: center; color: #556; padding: 40px; font-size: 14px; }
#updated { text-align: center; color: #334; font-size: 10px; margin-top: 8px; flex: none; }
/* スクロールを促すヒント */
#scroll-hint {
  text-align: center;
  color: #667;
  font-size: 10px;
  letter-spacing: 1px;
  margin: 6px 0 2px;
  flex: none;
}
#scroll-hint .arrow { animation: bob 1.4s ease-in-out infinite; display: inline-block; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
</style>
</head>
<body>
<h1>RANKING</h1>
<p class="sub">ソルジャータイピング 歴代スコア</p>
<div id="scroll-area">
  <div id="loading">読み込み中...</div>
  <table id="rank-table" style="display:none">
    <thead>
      <tr>
        <th style="width:36px;">#</th>
        <th>名前</th>
        <th>スコア</th>
        <th>Wave</th>
        <th>日付</th>
      </tr>
    </thead>
    <tbody id="rank-body"></tbody>
  </table>
</div>
<div id="scroll-hint"><span class="arrow">▼</span> スクロールで続きを見る <span class="arrow">▼</span></div>
<div id="updated"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBhMkq24FzmHjnJu0OQ7SeQgEV__eY9iGo",
  authDomain: "bubble-wars-ffcd4.firebaseapp.com",
  projectId: "bubble-wars-ffcd4",
  storageBucket: "bubble-wars-ffcd4.firebasestorage.app",
  messagingSenderId: "465836224399",
  appId: "1:465836224399:web:8852c314794cfc69a025fa"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 表示する最大件数
const MAX_ROWS = 100;

// シードスコア（実プレイのスコアと一緒にソートされる）
const SEED = [
  {name:'うんこ',                 score:287000, wave:5, date:'2026/6/8'},
  {name:'こうた',                 score:264500, wave:5, date:'2026/6/8'},
  {name:'バトルロワイアルZの使者', score:251000, wave:5, date:'2026/6/8'},
  {name:'AAA',                   score:238000, wave:5, date:'2026/6/8'},
  {name:'勇者',                   score:226500, wave:5, date:'2026/6/8'},
  {name:'Hunter',                score:213000, wave:5, date:'2026/6/8'},
  {name:'ランスロット',            score:205000, wave:5, date:'2026/6/8'},
];

function render(docs) {
  const real = docs.map(d => d.data());
  const all = [...real, ...SEED].sort((a,b) => b.score - a.score).slice(0, MAX_ROWS);

  const tbody = document.getElementById('rank-body');
  tbody.innerHTML = '';

  if (all.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#445;padding:24px;">まだスコアがありません</td></tr>';
  } else {
    all.forEach((e, i) => {
      const rank = i + 1;
      const cls = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';
      const waveCls = e.wave === 5 ? 'wave-badge wave-5' : 'wave-badge';
      const tr = document.createElement('tr');
      if (cls) tr.className = cls;
      tr.innerHTML = `
        <td>${rank}.</td>
        <td>${e.name}</td>
        <td><b>${e.score.toLocaleString()}</b></td>
        <td><span class="${waveCls}">Wave ${e.wave}</span></td>
        <td style="color:#445;font-size:11px;">${e.date ?? ''}</td>`;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('rank-table').style.display = '';
  document.getElementById('updated').textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');

  // スクロールできる件数がある時だけヒントを表示
  const area = document.getElementById('scroll-area');
  const hint = document.getElementById('scroll-hint');
  hint.style.visibility = (area.scrollHeight > area.clientHeight + 4) ? 'visible' : 'hidden';
}

const q = query(collection(db, 'scores_soldier_typing'), orderBy('score', 'desc'), limit(200));
onSnapshot(q, snap => render(snap.docs), err => {
  document.getElementById('loading').textContent = 'ランキングの取得に失敗しました';
  console.error(err);
});
</script>
</body>
</html>
